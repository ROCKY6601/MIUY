name: Build MIUY APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7
      - name: Unzip project
        run: |
          mkdir -p /tmp/proj
          unzip -q MIUY.zip -d /tmp/proj
          f=$(find /tmp/proj -name settings.gradle.kts | head -n 1)
          if [ -z "$f" ]; then echo "Zip ke andar project nahi mila"; exit 1; fi
          echo "PROJ=$(dirname "$f")" >> "$GITHUB_ENV"
      - name: Build release APK
        working-directory: ${{ env.PROJ }}
        run: gradle assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: MIUY-apk
          path: ${{ env.PROJ }}/app/build/outputs/apk/release/*.apk
